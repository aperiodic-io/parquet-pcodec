# Mutation testing with gremlins (github.com/go-gremlins/gremlins): make mutation.
# Every viable mutant must be killed (efficacy 100%). Run from this directory; the Makefile
# links the library with the pcodec_external tag, because gremlins tests a copy of the
# module, where ${SRCDIR}/../target does not exist.
silent: false
unleash:
  tags: pcodec_external
  threshold:
    efficacy: 100
  workers: 2
  test-cpu: 1
  timeout-coefficient: 3
  exclude-files:
    # Test data of the Go-produced conformance vectors: a mutant there changes the data,
    # which still round-trips, not behaviour.
    - "internal/vectors/data\\.go"
mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-negatives:
    enabled: true
  invert-assignments:
    enabled: true
  invert-bitwise:
    enabled: true
  invert-bwassign:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
  remove-self-assignments:
    enabled: true
