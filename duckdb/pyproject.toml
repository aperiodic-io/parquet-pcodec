[project]
name = "parquet-pcodec-duckdb-tests"
version = "0.1.0"
description = "SQL and end-to-end tests of the parquet_pcodec DuckDB extension"
requires-python = ">=3.14"
dependencies = [
    "duckdb==2.0.0",
    "pyarrow==23.0.0",
    "pytest==9.0.2",
    "pytz==2025.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long tests the mutation run skips"]
